[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netguru"
version = "0.1.0"
description = "Netguru Python application"
requires-python = ">=3.11"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
netguru = "netguru.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netguru = ["templates/*", "static/css/*", "static/js/*", "static/images/*", "static/icons.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
